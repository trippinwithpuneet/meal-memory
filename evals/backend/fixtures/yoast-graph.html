<!doctype html>
<html>
<head>
  <title>One-Pan Lemon Garlic Chicken - Sample Food Blog</title>
  <!-- Yoast emits @graph and adds attributes to the script tag. Both were
       real bugs once: the regex used to require type= to be the only attr. -->
  <script type="application/ld+json" class="yoast-schema-graph">
  {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "WebSite", "name": "Sample Food Blog" },
      { "@type": "Person", "name": "Sam Cook" },
      {
        "@type": "Recipe",
        "name": "One-Pan Lemon Garlic Chicken",
        "recipeIngredient": [
          "4 chicken thighs, bone-in",
          "3 tbsp olive oil",
          "1 lemon, sliced",
          "6 cloves garlic, crushed",
          "1 tsp dried oregano",
          "Salt and black pepper to taste"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Heat the oven to 200C / 400F." },
          { "@type": "HowToStep", "text": "Toss the chicken with oil, garlic, oregano, salt and pepper." },
          { "@type": "HowToStep", "text": "Arrange in a single layer with the lemon slices tucked around." },
          { "@type": "HowToStep", "text": "Roast for 35 minutes until the skin is crisp and juices run clear." },
          { "@type": "HowToStep", "text": "Rest 5 minutes before serving." }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <h1>One-Pan Lemon Garlic Chicken</h1>
  <p>A weeknight staple in our house.</p>
</body>
</html>
