<!doctype html>
<html>
<head>
  <title>Tofu Stir Fry</title>
  <!-- Top-level @type Recipe, instructions as plain strings. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Tofu Stir Fry",
    "recipeIngredient": [
      "400g firm tofu, cubed",
      "2 tbsp soy sauce",
      "1 tbsp sesame oil",
      "1 head broccoli, florets",
      "1 red pepper, sliced",
      "2 cloves garlic, minced",
      "1 thumb ginger, grated"
    ],
    "recipeInstructions": [
      "Press and cube the tofu.",
      "Sear the tofu in sesame oil until golden on all sides.",
      "Add garlic and ginger, cook 30 seconds.",
      "Add broccoli and pepper, stir fry 4 minutes.",
      "Splash in soy sauce and toss to coat."
    ]
  }
  </script>
</head>
<body><h1>Tofu Stir Fry</h1></body>
</html>
